<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiwi GCS</title>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <linearGradient id="kiwi-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a3e635" />
          <stop offset="1" stop-color="#4d7c0f" />
        </linearGradient>
        <linearGradient id="kiwi-graphite" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#334155" />
          <stop offset="1" stop-color="#0f172a" />
        </linearGradient>

        <symbol id="kiwi-glyph" viewBox="0 0 512 512">
          <g transform="translate(6 -11) rotate(12 256 276)">
            <path
              d="M217.9 194A44 44 0 0 1 294.1 194L345.9 284A44 44 0 0 1 307.8 350L204.2 350A44 44 0 0 1 166.1 284Z"
              fill="none"
              stroke="var(--tri, url(#kiwi-grad))"
              stroke-width="40"
              stroke-linejoin="round"
            />
            <g style="fill: var(--wheel, url(#kiwi-graphite))">
              <rect
                x="-46"
                y="-20"
                width="92"
                height="40"
                rx="20"
                transform="translate(394.6 356) rotate(120)"
              />
              <rect
                x="-46"
                y="-20"
                width="92"
                height="40"
                rx="20"
                transform="translate(117.4 356) rotate(60)"
              />
              <rect x="-46" y="-20" width="92" height="40" rx="20" transform="translate(256 116)" />
              <circle cx="256" cy="276" r="28" />
            </g>
          </g>
          <circle cx="262" cy="265" r="9" style="fill: var(--eye, #fbbf24)" />
        </symbol>

        <symbol id="kiwi-icon" viewBox="0 0 512 512">
          <rect
            x="32"
            y="32"
            width="448"
            height="448"
            rx="102"
            stroke-width="2"
            style="fill: var(--ibg, #fff); stroke: var(--ibd, #e2e8f0)"
          />
          <g transform="translate(12.8 12.8) scale(.95)"><use href="#kiwi-glyph" /></g>
        </symbol>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
