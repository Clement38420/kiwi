[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[features]
default = []
std = ["serde/std", "serde/rc", "postcard/use-std", "dep:rand"]
ts = ["std", "dep:ts-rs"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = "1.1.3"
cobs = { version = "0.5.1", default-features = false }
crc = { version = "3.4.0", default-features = false }
defmt = "1.2.0"
ts-rs = { version = "12.0.1", optional = true }
rand = { version = "0.10.3", optional = true }
